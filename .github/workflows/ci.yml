name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore RecipeApp_Eboaguillaume/RecipeApp_Eboaguillaume.sln

      - name: Build
        run: dotnet build RecipeApp_Eboaguillaume/RecipeApp_Eboaguillaume.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test RecipeApp_Eboaguillaume/RecipeApp_Eboaguillaume.sln --no-build --configuration Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t recipeapp:ci .
